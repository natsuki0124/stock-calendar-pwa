<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股情報日曆</title>
  <link rel="manifest" href="/manifest.json">
  <!-- 引入美觀的月曆套件 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-4xl mx-auto p-4">
    <header class="mb-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">美股重點觀測曆</h1>
    </header>

    <!-- 月曆區域 (顯示當月重要事件: 財報、FOMC 等) -->
    <div id="calendar" class="bg-white p-4 rounded-xl shadow mb-6"></div>

    <!-- 點選日期後顯示當天新聞清單 -->
    <div id="news-section" class="bg-white p-6 rounded-xl shadow hidden">
      <h2 id="selected-date-title" class="text-xl font-bold mb-4 text-blue-700"></h2>
      <div id="news-list" class="space-y-4"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
